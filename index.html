<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>待办清单</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --panel: #ffffff;
      --panel-soft: #eef7f5;
      --text: #18211f;
      --muted: #66736f;
      --line: #d8e1dd;
      --primary: #0f766e;
      --primary-strong: #0b5f59;
      --danger: #b42318;
      --warning: #b7791f;
      --shadow: 0 18px 50px rgba(20, 37, 34, 0.12);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(15, 118, 110, 0.08), transparent 220px),
        var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: clamp(24px, 7vw, 36px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      min-width: 112px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      text-align: right;
      box-shadow: 0 8px 22px rgba(20, 37, 34, 0.07);
    }

    .summary strong {
      display: block;
      color: var(--primary);
      font-size: 24px;
      line-height: 1;
    }

    .summary span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .task-input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: #fbfcfb;
      outline: none;
    }

    .task-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .icon-button:hover {
      background: #edf4f2;
      color: var(--text);
    }

    .icon-button:active {
      transform: scale(0.96);
    }

    .add-button {
      width: 46px;
      height: 46px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
    }

    .add-button:hover {
      background: var(--primary-strong);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .filters {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(58px, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .filter {
      min-width: 58px;
      height: 32px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
    }

    .filter.active {
      background: var(--primary);
      color: #fff;
    }

    .clear-button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--danger);
      font-size: 14px;
    }

    .clear-button:hover {
      background: #fff0ed;
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .task-item {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 62px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .task-item:last-child {
      border-bottom: 0;
    }

    .check {
      width: 28px;
      height: 28px;
      border: 2px solid #9db0aa;
      border-radius: 50%;
      background: #fff;
      color: #fff;
      display: inline-grid;
      place-items: center;
    }

    .task-item.done .check {
      border-color: var(--primary);
      background: var(--primary);
    }

    .task-main {
      min-width: 0;
    }

    .task-title {
      width: 100%;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .task-item.done .task-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .edit-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      outline: none;
      background: #fbfffe;
    }

    .empty {
      display: none;
      padding: 46px 20px;
      text-align: center;
      color: var(--muted);
      background: #fff;
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 18px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(18px);
      padding: 10px 14px;
      border-radius: var(--radius);
      background: #142522;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 760px);
        padding-top: 18px;
      }

      .topbar {
        align-items: flex-start;
      }

      .summary {
        min-width: 96px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .filters {
        width: 100%;
      }

      .clear-button {
        align-self: flex-end;
      }

      .task-item {
        grid-template-columns: 34px 1fr auto;
        padding: 10px;
      }

      .task-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="待办清单应用">
    <header class="topbar">
      <div>
        <h1 class="title">待办清单</h1>
        <div class="date" id="today"></div>
      </div>
      <div class="summary" aria-live="polite">
        <strong id="leftCount">0</strong>
        <span>未完成</span>
      </div>
    </header>

    <section class="panel">
      <form class="composer" id="todoForm">
        <input class="task-input" id="taskInput" type="text" autocomplete="off" maxlength="80" placeholder="添加一个待办事项" aria-label="待办事项">
        <button class="add-button icon-button" type="submit" aria-label="添加待办" title="添加待办">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>

      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="筛选待办">
          <button class="filter active" type="button" data-filter="all" role="tab" aria-selected="true">全部</button>
          <button class="filter" type="button" data-filter="active" role="tab" aria-selected="false">待办</button>
          <button class="filter" type="button" data-filter="done" role="tab" aria-selected="false">完成</button>
        </div>
        <button class="clear-button" id="clearDone" type="button">清除已完成</button>
      </div>

      <ul class="task-list" id="taskList"></ul>
      <div class="empty" id="emptyState">
        <strong>暂无待办</strong>
        <span>输入事项后按回车即可添加。</span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "h5-todo-list-v1";
    const state = {
      tasks: loadTasks(),
      filter: "all",
      editingId: null
    };

    const form = document.querySelector("#todoForm");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#taskList");
    const empty = document.querySelector("#emptyState");
    const leftCount = document.querySelector("#leftCount");
    const clearDone = document.querySelector("#clearDone");
    const toast = document.querySelector("#toast");
    const today = document.querySelector("#today");
    const filters = document.querySelectorAll(".filter");

    today.textContent = new Intl.DateTimeFormat("zh-CN", {
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      addTask(input.value);
    });

    filters.forEach((button) => {
      button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        filters.forEach((item) => {
          const selected = item === button;
          item.classList.toggle("active", selected);
          item.setAttribute("aria-selected", String(selected));
        });
        render();
      });
    });

    clearDone.addEventListener("click", () => {
      const doneCount = state.tasks.filter((task) => task.done).length;
      if (!doneCount) {
        showToast("没有已完成事项");
        return;
      }
      state.tasks = state.tasks.filter((task) => !task.done);
      persist();
      render();
      showToast("已清除完成事项");
    });

    function addTask(value) {
      const title = value.trim();
      if (!title) {
        showToast("请输入待办内容");
        input.focus();
        return;
      }

      state.tasks.unshift({
        id: createId(),
        title,
        done: false,
        createdAt: Date.now()
      });

      input.value = "";
      persist();
      render();
    }

    function toggleTask(id) {
      state.tasks = state.tasks.map((task) =>
        task.id === id ? { ...task, done: !task.done } : task
      );
      persist();
      render();
    }

    function removeTask(id) {
      state.tasks = state.tasks.filter((task) => task.id !== id);
      persist();
      render();
      showToast("已删除");
    }

    function startEdit(id) {
      state.editingId = id;
      render();
      const editInput = document.querySelector(`[data-edit-id="${id}"]`);
      if (editInput) {
        editInput.focus();
        editInput.select();
      }
    }

    function finishEdit(id, value) {
      const title = value.trim();
      if (!title) {
        removeTask(id);
        state.editingId = null;
        return;
      }
      state.tasks = state.tasks.map((task) =>
        task.id === id ? { ...task, title } : task
      );
      state.editingId = null;
      persist();
      render();
    }

    function cancelEdit() {
      state.editingId = null;
      render();
    }

    function render() {
      const visibleTasks = state.tasks.filter((task) => {
        if (state.filter === "active") return !task.done;
        if (state.filter === "done") return task.done;
        return true;
      });

      leftCount.textContent = String(state.tasks.filter((task) => !task.done).length);
      clearDone.disabled = !state.tasks.some((task) => task.done);
      clearDone.style.opacity = clearDone.disabled ? "0.45" : "1";
      empty.style.display = visibleTasks.length ? "none" : "block";
      list.innerHTML = "";

      visibleTasks.forEach((task) => {
        const item = document.createElement("li");
        item.className = `task-item${task.done ? " done" : ""}`;

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", task.done ? "标记为未完成" : "标记为完成");
        check.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
        check.addEventListener("click", () => toggleTask(task.id));

        const main = document.createElement("div");
        main.className = "task-main";

        if (state.editingId === task.id) {
          const editInput = document.createElement("input");
          editInput.className = "edit-input";
          editInput.value = task.title;
          editInput.maxLength = 80;
          editInput.dataset.editId = task.id;
          editInput.setAttribute("aria-label", "编辑待办");
          editInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") finishEdit(task.id, editInput.value);
            if (event.key === "Escape") cancelEdit();
          });
          editInput.addEventListener("blur", () => finishEdit(task.id, editInput.value));
          main.append(editInput);
        } else {
          const title = document.createElement("div");
          title.className = "task-title";
          title.textContent = task.title;
          title.addEventListener("dblclick", () => startEdit(task.id));

          const meta = document.createElement("div");
          meta.className = "task-meta";
          meta.textContent = formatTime(task.createdAt);

          main.append(title, meta);
        }

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const edit = document.createElement("button");
        edit.className = "icon-button";
        edit.type = "button";
        edit.setAttribute("aria-label", "编辑");
        edit.title = "编辑";
        edit.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
        edit.addEventListener("click", () => startEdit(task.id));

        const remove = document.createElement("button");
        remove.className = "icon-button";
        remove.type = "button";
        remove.setAttribute("aria-label", "删除");
        remove.title = "删除";
        remove.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
        remove.addEventListener("click", () => removeTask(task.id));

        actions.append(edit, remove);
        item.append(check, main, actions);
        list.append(item);
      });
    }

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
    }

    function createId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return globalThis.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function formatTime(timestamp) {
      return new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(timestamp));
    }

    let toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    render();
  </script>
</body>
</html>
