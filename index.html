<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>待办清单</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121820;
      --panel-soft: #19242c;
      --surface: #0f151c;
      --surface-raised: #17202a;
      --text: #edf3f2;
      --muted: #93a3a0;
      --line: #26343f;
      --primary: #2dd4bf;
      --primary-strong: #14b8a6;
      --primary-contrast: #06221f;
      --danger: #fb7185;
      --warning: #fbbf24;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0, rgba(45, 212, 191, 0.14), transparent 330px),
        linear-gradient(180deg, rgba(15, 21, 28, 0.96), transparent 260px),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: clamp(24px, 7vw, 36px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      min-width: 112px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      text-align: right;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
    }

    .summary strong {
      display: block;
      color: var(--primary);
      font-size: 24px;
      line-height: 1;
    }

    .summary span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr 154px 46px;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .task-input,
    .due-input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--surface);
      outline: none;
    }

    .task-input:focus,
    .due-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.18);
    }

    .due-input {
      color: var(--muted);
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .icon-button:hover {
      background: var(--surface-raised);
      color: var(--text);
    }

    .icon-button:active {
      transform: scale(0.96);
    }

    .add-button {
      width: 46px;
      height: 46px;
      border-radius: var(--radius);
      background: var(--primary);
      color: var(--primary-contrast);
    }

    .add-button:hover {
      background: var(--primary-strong);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .filters {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(58px, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .filter {
      min-width: 58px;
      height: 32px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
    }

    .filter.active {
      background: var(--primary);
      color: var(--primary-contrast);
    }

    .sort-select {
      min-height: 34px;
      padding: 0 34px 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--panel);
      outline: none;
    }

    .sort-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.18);
    }

    .clear-button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--danger);
      font-size: 14px;
    }

    .clear-button:hover {
      background: rgba(251, 113, 133, 0.14);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .complete-all-button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      color: var(--primary);
      font-size: 14px;
    }

    .complete-all-button:hover {
      background: #20342f;
    }

    .export-button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--primary);
      font-size: 14px;
    }

    .export-button:hover {
      background: rgba(45, 212, 191, 0.14);
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .task-item {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 62px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .task-item:last-child {
      border-bottom: 0;
    }

    .check {
      width: 28px;
      height: 28px;
      border: 2px solid #60716e;
      border-radius: 50%;
      background: var(--surface);
      color: var(--bg);
      display: inline-grid;
      place-items: center;
    }

    .task-item.done .check {
      border-color: var(--primary);
      background: var(--primary);
    }

    .task-main {
      min-width: 0;
    }

    .task-title {
      width: 100%;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .task-item.done .task-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
    }

    .meta-chip.due {
      color: var(--primary);
    }

    .meta-chip.soon {
      color: var(--warning);
    }

    .meta-chip.overdue {
      color: var(--danger);
      background: rgba(251, 113, 133, 0.14);
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .edit-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      outline: none;
      color: var(--text);
      background: var(--surface);
    }

    .empty {
      display: none;
      padding: 46px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 18px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(18px);
      padding: 10px 14px;
      border-radius: var(--radius);
      background: #edf3f2;
      color: #0b0f14;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 760px);
        padding-top: 18px;
      }

      .topbar {
        align-items: flex-start;
      }

      .summary {
        min-width: 96px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .composer {
        grid-template-columns: 1fr 46px;
      }

      .due-input {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .filters {
        width: 100%;
      }

      .sort-select {
        width: 100%;
      }

      .clear-button {
        align-self: flex-end;
      }

      .toolbar-actions {
        justify-content: flex-end;
      }

      .task-item {
        grid-template-columns: 34px 1fr auto;
        padding: 10px;
      }

      .task-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="待办清单应用">
    <header class="topbar">
      <div>
        <h1 class="title">待办清单</h1>
        <div class="date" id="today"></div>
      </div>
      <div class="summary" aria-live="polite">
        <strong id="leftCount">0</strong>
        <span>未完成</span>
      </div>
    </header>

    <section class="panel">
      <form class="composer" id="todoForm">
        <input class="task-input" id="taskInput" type="text" autocomplete="off" maxlength="80" placeholder="添加一个待办事项" aria-label="待办事项">
        <input class="due-input" id="dueInput" type="date" aria-label="截止日期">
        <button class="add-button icon-button" type="submit" aria-label="添加待办" title="添加待办">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>

      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="筛选待办">
          <button class="filter active" type="button" data-filter="all" role="tab" aria-selected="true">全部</button>
          <button class="filter" type="button" data-filter="active" role="tab" aria-selected="false">待办</button>
          <button class="filter" type="button" data-filter="done" role="tab" aria-selected="false">完成</button>
        </div>
        <select class="sort-select" id="sortSelect" aria-label="排序方式">
          <option value="default">默认排序</option>
          <option value="due-asc">截止日期正序</option>
          <option value="due-desc">截止日期倒序</option>
        </select>
        <div class="toolbar-actions">
          <button class="export-button" id="exportTxt" type="button">导出 TXT</button>
          <button class="complete-all-button" id="completeAll" type="button">全部完成</button>
          <button class="clear-button" id="clearDone" type="button">清除已完成</button>
        </div>
      </div>

      <ul class="task-list" id="taskList"></ul>
      <div class="empty" id="emptyState">
        <strong>暂无待办</strong>
        <span>输入事项后按回车即可添加。</span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "h5-todo-list-v1";
    const state = {
      tasks: loadTasks(),
      filter: "all",
      sort: "default",
      editingId: null
    };

    const form = document.querySelector("#todoForm");
    const input = document.querySelector("#taskInput");
    const dueInput = document.querySelector("#dueInput");
    const list = document.querySelector("#taskList");
    const empty = document.querySelector("#emptyState");
    const leftCount = document.querySelector("#leftCount");
    const exportTxt = document.querySelector("#exportTxt");
    const completeAll = document.querySelector("#completeAll");
    const clearDone = document.querySelector("#clearDone");
    const sortSelect = document.querySelector("#sortSelect");
    const toast = document.querySelector("#toast");
    const today = document.querySelector("#today");
    const filters = document.querySelectorAll(".filter");

    today.textContent = new Intl.DateTimeFormat("zh-CN", {
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());
    dueInput.min = toDateInputValue(new Date());

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      addTask(input.value, dueInput.value);
    });

    filters.forEach((button) => {
      button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        filters.forEach((item) => {
          const selected = item === button;
          item.classList.toggle("active", selected);
          item.setAttribute("aria-selected", String(selected));
        });
        render();
      });
    });

    sortSelect.addEventListener("change", () => {
      state.sort = sortSelect.value;
      render();
    });

    exportTxt.addEventListener("click", exportTasksAsTxt);

    completeAll.addEventListener("click", () => {
      const activeCount = state.tasks.filter((task) => !task.done).length;
      if (!activeCount) {
        showToast("没有未完成事项");
        return;
      }
      state.tasks = state.tasks.map((task) => ({ ...task, done: true }));
      state.editingId = null;
      persist();
      render();
      showToast("已全部完成");
    });

    clearDone.addEventListener("click", () => {
      const doneCount = state.tasks.filter((task) => task.done).length;
      if (!doneCount) {
        showToast("没有已完成事项");
        return;
      }
      state.tasks = state.tasks.filter((task) => !task.done);
      persist();
      render();
      showToast("已清除完成事项");
    });

    function exportTasksAsTxt() {
      if (!state.tasks.length) {
        showToast("没有可导出的待办");
        return;
      }

      const exportedAt = formatFullDateTime(new Date());
      const activeCount = state.tasks.filter((task) => !task.done).length;
      const doneCount = state.tasks.length - activeCount;
      const lines = [
        "待办清单导出",
        `导出时间：${exportedAt}`,
        `总数：${state.tasks.length}，未完成：${activeCount}，已完成：${doneCount}`,
        ""
      ];

      state.tasks.forEach((task, index) => {
        lines.push(`${index + 1}. [${task.done ? "已完成" : "待办"}] ${task.title}`);
        lines.push(`   创建时间：${formatFullDateTime(new Date(task.createdAt))}`);
        lines.push(`   截止日期：${task.dueAt ? formatDueDate(task.dueAt) : "无"}`);
        lines.push("");
      });

      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `todo-list-${formatFileTimestamp(new Date())}.txt`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("已导出 TXT");
    }

    function addTask(value, dueValue) {
      const title = value.trim();
      if (!title) {
        showToast("请输入待办内容");
        input.focus();
        return;
      }

      state.tasks.unshift({
        id: createId(),
        title,
        dueAt: normalizeDateValue(dueValue),
        done: false,
        createdAt: Date.now()
      });

      input.value = "";
      dueInput.value = "";
      persist();
      render();
    }

    function toggleTask(id) {
      state.tasks = state.tasks.map((task) =>
        task.id === id ? { ...task, done: !task.done } : task
      );
      persist();
      render();
    }

    function removeTask(id) {
      state.tasks = state.tasks.filter((task) => task.id !== id);
      persist();
      render();
      showToast("已删除");
    }

    function startEdit(id) {
      state.editingId = id;
      render();
      const editInput = document.querySelector(`[data-edit-id="${id}"]`);
      if (editInput) {
        editInput.focus();
        editInput.select();
      }
    }

    function finishEdit(id, value) {
      const title = value.trim();
      if (!title) {
        removeTask(id);
        state.editingId = null;
        return;
      }
      state.tasks = state.tasks.map((task) =>
        task.id === id ? { ...task, title } : task
      );
      state.editingId = null;
      persist();
      render();
    }

    function cancelEdit() {
      state.editingId = null;
      render();
    }

    function render() {
      const visibleTasks = state.tasks.filter((task) => {
        if (state.filter === "active") return !task.done;
        if (state.filter === "done") return task.done;
        return true;
      }).sort(compareTasks);

      leftCount.textContent = String(state.tasks.filter((task) => !task.done).length);
      exportTxt.disabled = !state.tasks.length;
      exportTxt.style.opacity = exportTxt.disabled ? "0.45" : "1";
      completeAll.disabled = !state.tasks.some((task) => !task.done);
      completeAll.style.opacity = completeAll.disabled ? "0.45" : "1";
      clearDone.disabled = !state.tasks.some((task) => task.done);
      clearDone.style.opacity = clearDone.disabled ? "0.45" : "1";
      empty.style.display = visibleTasks.length ? "none" : "block";
      list.innerHTML = "";

      visibleTasks.forEach((task) => {
        const item = document.createElement("li");
        item.className = `task-item${task.done ? " done" : ""}`;

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", task.done ? "标记为未完成" : "标记为完成");
        check.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
        check.addEventListener("click", () => toggleTask(task.id));

        const main = document.createElement("div");
        main.className = "task-main";

        if (state.editingId === task.id) {
          const editInput = document.createElement("input");
          editInput.className = "edit-input";
          editInput.value = task.title;
          editInput.maxLength = 80;
          editInput.dataset.editId = task.id;
          editInput.setAttribute("aria-label", "编辑待办");
          editInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") finishEdit(task.id, editInput.value);
            if (event.key === "Escape") cancelEdit();
          });
          editInput.addEventListener("blur", () => finishEdit(task.id, editInput.value));
          main.append(editInput);
        } else {
          const title = document.createElement("div");
          title.className = "task-title";
          title.textContent = task.title;
          title.addEventListener("dblclick", () => startEdit(task.id));

          const meta = document.createElement("div");
          meta.className = "task-meta";

          const created = document.createElement("span");
          created.className = "meta-chip";
          created.textContent = `创建 ${formatTime(task.createdAt)}`;
          meta.append(created);

          if (task.dueAt) {
            const due = document.createElement("span");
            due.className = `meta-chip due ${getDueState(task)}`;
            due.textContent = `截止 ${formatDueDate(task.dueAt)}`;
            meta.append(due);
          }

          main.append(title, meta);
        }

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const edit = document.createElement("button");
        edit.className = "icon-button";
        edit.type = "button";
        edit.setAttribute("aria-label", "编辑");
        edit.title = "编辑";
        edit.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
        edit.addEventListener("click", () => startEdit(task.id));

        const remove = document.createElement("button");
        remove.className = "icon-button";
        remove.type = "button";
        remove.setAttribute("aria-label", "删除");
        remove.title = "删除";
        remove.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
        remove.addEventListener("click", () => removeTask(task.id));

        actions.append(edit, remove);
        item.append(check, main, actions);
        list.append(item);
      });
    }

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
    }

    function createId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return globalThis.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function compareTasks(a, b) {
      if (state.sort === "default") return 0;

      const aDue = getDueTimestamp(a);
      const bDue = getDueTimestamp(b);
      const aHasDue = Number.isFinite(aDue);
      const bHasDue = Number.isFinite(bDue);

      if (!aHasDue && !bHasDue) return b.createdAt - a.createdAt;
      if (!aHasDue) return 1;
      if (!bHasDue) return -1;

      const direction = state.sort === "due-asc" ? 1 : -1;
      return (aDue - bDue) * direction || b.createdAt - a.createdAt;
    }

    function getDueTimestamp(task) {
      if (!task.dueAt) return NaN;
      const dateValue = normalizeDateValue(task.dueAt);
      if (!dateValue) return NaN;
      const [year, month, day] = dateValue.split("-").map(Number);
      return new Date(year, month - 1, day).getTime();
    }

    function getDueState(task) {
      if (task.done || !task.dueAt) return "";
      const dueTime = getDueTimestamp(task);
      if (Number.isNaN(dueTime)) return "";
      const todayTime = getStartOfToday().getTime();
      if (dueTime < todayTime) return "overdue";
      if (dueTime === todayTime) return "soon";
      return "";
    }

    function formatTime(timestamp) {
      return new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(timestamp));
    }

    function formatDueDate(value) {
      const dateValue = normalizeDateValue(value);
      if (!dateValue) return value;
      const [year, month, day] = dateValue.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(date);
    }

    function formatFullDateTime(date) {
      if (Number.isNaN(date.getTime())) return "无效时间";
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatFileTimestamp(date) {
      const pad = (number) => String(number).padStart(2, "0");
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("") + `-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
    }

    function toDateInputValue(date) {
      const pad = (number) => String(number).padStart(2, "0");
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-");
    }

    function getStartOfToday() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function normalizeDateValue(value) {
      if (!value) return "";
      const rawValue = String(value);
      const dateMatch = rawValue.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (dateMatch) return dateMatch[0];

      const date = new Date(rawValue);
      if (Number.isNaN(date.getTime())) return "";
      return toDateInputValue(date);
    }

    let toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    render();
  </script>
</body>
</html>
